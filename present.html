    <link rel="preload" href="./data.json" as="fetch" crossorigin="anonymous" />
    <script type="module" crossorigin src="/space-vis-test/assets/present-BCLcGIZU.js"></script>
    <link rel="modulepreload" crossorigin href="/space-vis-test/assets/markers-4yRh5EAw.js">
    <link rel="modulepreload" crossorigin href="/space-vis-test/assets/engine-DamCo5tY.js">

  </head>
  <body>
    <!-- Covers the scene while it loads, and fades once the scene and the steps are ready. -->
    <section id="present-loading" class="present-loading">
      <p id="present-loading-text" role="status">Loading the Solar System…</p>
    </section>

    <!-- For screen readers: what this is (the presentation's own title once it loads), and where it is. -->
    <main class="visually-hidden">
      <h1 id="present-heading">OUniverse presentation</h1>
    </main>

    <!-- Where the presentation is: the step's title, and "2 of 3". Arrow keys, Page Up/Down (a
         clicker) and Space step through; the buttons are there for a mouse. -->
    <nav id="present-bar" class="present-bar" aria-label="Presentation" hidden>
      <button id="present-prev" type="button" aria-label="Previous step">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M15 6l-6 6l6 6"/></svg>
      </button>
      <p class="present-where"><span id="present-title"></span> <span id="present-count" class="present-count"></span></p>
      <button id="present-next" type="button" aria-label="Next step">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M9 6l6 6l-6 6"/></svg>
      </button>
    </nav>

    <img id="present-logo" class="present-logo" src="/space-vis-test/images/brand/ou-logo-primary-white.svg" alt="The Open University" width="561" height="192">

    <div id="present-announcer" class="visually-hidden" aria-live="polite"></div>

  </body>
</html>
